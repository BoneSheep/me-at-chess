[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "me-at-chess"
version = "0.1.0"
description = "A chess bot that plays like Ruben (BoneSheep): Maia-2 fine-tuned on his own games."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "chess==1.10.0",
    "einops>=0.8",
    "gdown>=5.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pyzstd>=0.15",
    "requests>=2.32",
    "tqdm>=4.66",
    # torch is installed separately (CPU wheel in CI), maia2 with --no-deps
    # because it pins exact versions that clash with the CPU index.
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mac-fetch = "me_at_chess.fetch_chesscom:main"
mac-dataset = "me_at_chess.dataset:main"
mac-finetune = "me_at_chess.finetune:main"
mac-uci = "me_at_chess.uci:main"
mac-play = "me_at_chess.play:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
