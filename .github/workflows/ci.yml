name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "reports/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps maia2==0.10.0
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
